<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back | Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-wrapper container-fluid">
        <div class="row min-vh-100">
            <!-- Left Section: Welcome Area -->
             <section class="col-lg-6 welcome-section">
                <div class="welcome-content">
                    <div class="brand">
                        <span class="brand-icon">🌟</span>
                        <span>NOVA</span>
                        </div>
                        <div class="welcome-text">
                            <span class="welcome-label">Welcome Back!</span>
                            <h1>
                                Welcome<br>
                                Back!
                            </h1>
                            <p>
                                Great to have you here again.
                                Sign in to continue your journey
                                and explore everything waiting for you.
                            </p>
                            </div>
                            <!-- Decorative Graphics -->
                            <div class="visual-container">
                                <div class="orbit orbit-one"></div>
                                <div class="orbit orbit-two"></div>
                                <div class="orbit orbit-three"></div>
                                <div class="visual-circle">
                                    <span>🌟</span>
                                </div>
                                <div class="floating-dot dot-one"></div>
                                <div class="floating-dot dot-two"></div>
                                <div class="floating-dot dot-three"></div>
                            </div>
                            <div class="welcome-footer">
                                <span>DESIGNED FOR WHAT'S NEXT.</span>
                                </div>
                                </div>
                                </section>
            <!-- Right Section: Login Form -->
             <section class="col-lg-6 form-section">
                <div class="form-container">
                    <h2>Sign In</h2>
                    <p> Enter your details to access your account.</p>
                    <form>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                        <label for="password">Password</label>
                        <div class="password-box">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password">Show</button>
                        </div>
                        <div class="form-options">
                            <label>
                                <input type="checkbox" id="remember-me"> Remember Me
                            </label>
                            <a href="#">Forgot Password?</a>
                        </div>
                        <button type="submit" >Sign In</button>
                        <div class="divider">
                            <span>OR</span>
                        </div>
                        <button type="button" class="google-signin">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Google_%22G%22_Logo.svg/512px-Google_%22G%22_Logo.svg.png" alt="Google Logo">
                            Sign in with Google
                        </button>
                        <p class="signup-text">
                            Don't have an account? 
                            <a href="#">Sign up</a>
                        </p>
                    </form>
                </div>
            </section>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
